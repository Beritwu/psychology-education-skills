<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc"><title id="title">经典条件作用 · 时间序列</title><desc id="desc">配对片段代表反复配对的阶段。一次播放不表示一次就能学会；图中没有真实次数、成功率或反应强度。</desc><rect width="1180" height="430" rx="20" fill="#f3f6f4"/><g font-family="Arial, sans-serif" fill="#183946"><text x="30" y="45" font-size="23" font-weight="bold">经典条件作用 · 时间序列</text><rect x="30" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="48" y="120" font-size="21" font-weight="bold">学习前</text><text x="48" y="167" font-size="17" font-weight="normal">声音：中性刺激</text><text x="48" y="214" font-size="17" font-weight="normal">不引发目标唾液反应</text><text x="48" y="261" font-size="17" font-weight="normal">食物：无条件刺激</text><text x="48" y="308" font-size="17" font-weight="normal">唾液：无条件反应</text><rect x="415" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="433" y="120" font-size="21" font-weight="bold">配对阶段</text><text x="433" y="167" font-size="17" font-weight="normal">先出现声音</text><text x="433" y="214" font-size="17" font-weight="normal">随后出现食物</text><text x="433" y="261" font-size="17" font-weight="normal">食物引发唾液反应</text><text x="433" y="308" font-size="17" font-weight="normal">重复配对建立学习关系</text><rect x="800" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="818" y="120" font-size="21" font-weight="bold">学习后测试</text><text x="818" y="167" font-size="17" font-weight="normal">仅呈现声音：条件刺激</text><text x="818" y="214" font-size="17" font-weight="normal">食物未出现</text><text x="818" y="261" font-size="17" font-weight="normal">唾液：条件反应</text><text x="818" y="308" font-size="17" font-weight="normal">名称取决于学习历史</text><text x="30" y="390" font-size="15">草稿—未通过 QA · 待真实教师复核</text></g></svg>