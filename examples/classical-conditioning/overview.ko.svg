<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ko" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc"><title id="title">고전적 조건형성 · 사건 순서</title><desc id="desc">짝짓기 장면은 반복되는 과정을 대표합니다. 한 번 재생했다고 한 번에 학습한다는 뜻이 아닙니다. 실제 횟수, 성공률, 반응 강도는 제시하지 않습니다.</desc><rect width="1180" height="430" rx="20" fill="#f3f6f4"/><g font-family="Arial, sans-serif" fill="#183946"><text x="30" y="45" font-size="23" font-weight="bold">고전적 조건형성 · 사건 순서</text><rect x="30" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="48" y="120" font-size="21" font-weight="bold">학습 전</text><text x="48" y="167" font-size="17" font-weight="normal">소리: 중성 자극</text><text x="48" y="214" font-size="17" font-weight="normal">대상 침 분비 없음</text><text x="48" y="261" font-size="17" font-weight="normal">먹이: 무조건 자극</text><text x="48" y="308" font-size="17" font-weight="normal">침 분비: 무조건 반응</text><rect x="415" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="433" y="120" font-size="21" font-weight="bold">짝짓기 단계</text><text x="433" y="167" font-size="17" font-weight="normal">소리를 먼저 제시</text><text x="433" y="214" font-size="17" font-weight="normal">이어서 먹이를 제시</text><text x="433" y="261" font-size="17" font-weight="normal">먹이가 침 분비를 유발</text><text x="433" y="308" font-size="17" font-weight="normal">반복 짝짓기를 통해 학습</text><rect x="800" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="818" y="120" font-size="21" font-weight="bold">학습 후 검사</text><text x="818" y="167" font-size="17" font-weight="normal">소리만 제시: 조건 자극</text><text x="818" y="214" font-size="17" font-weight="normal">먹이는 제시하지 않음</text><text x="818" y="261" font-size="17" font-weight="normal">침 분비: 조건 반응</text><text x="818" y="308" font-size="17" font-weight="normal">이름은 학습 이력에 따라 결정</text><text x="30" y="390" font-size="15">시연용 초안 · 교사 검토 대기</text></g></svg>