<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc"><title id="title">古典的条件づけ · 出来事の順序</title><desc id="desc">対提示の場面は繰り返しの過程を代表します。一度の再生で学習が成立するという意味ではありません。回数、成功率、反応強度の測定値は示していません。</desc><rect width="1180" height="430" rx="20" fill="#f3f6f4"/><g font-family="Arial, sans-serif" fill="#183946"><text x="30" y="45" font-size="23" font-weight="bold">古典的条件づけ · 出来事の順序</text><rect x="30" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="48" y="120" font-size="21" font-weight="bold">学習前</text><text x="48" y="167" font-size="17" font-weight="normal">音：中性刺激</text><text x="48" y="214" font-size="17" font-weight="normal">対象となる唾液反応なし</text><text x="48" y="261" font-size="17" font-weight="normal">食物：無条件刺激</text><text x="48" y="308" font-size="17" font-weight="normal">唾液：無条件反応</text><rect x="415" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="433" y="120" font-size="21" font-weight="bold">対提示の段階</text><text x="433" y="167" font-size="17" font-weight="normal">まず音を提示する</text><text x="433" y="214" font-size="17" font-weight="normal">続いて食物を提示する</text><text x="433" y="261" font-size="17" font-weight="normal">食物が唾液反応を引き起こす</text><text x="433" y="308" font-size="17" font-weight="normal">繰り返しの対提示で学習する</text><rect x="800" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="818" y="120" font-size="21" font-weight="bold">学習後のテスト</text><text x="818" y="167" font-size="17" font-weight="normal">音だけを提示：条件刺激</text><text x="818" y="214" font-size="17" font-weight="normal">食物は提示しない</text><text x="818" y="261" font-size="17" font-weight="normal">唾液：条件反応</text><text x="818" y="308" font-size="17" font-weight="normal">名称は学習の履歴で決まる</text><text x="30" y="390" font-size="15">デモ草稿 · 教師による確認待ち</text></g></svg>