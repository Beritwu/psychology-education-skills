<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc"><title id="title">Classical conditioning · Event sequence</title><desc id="desc">The pairing segment represents repeated pairings. One playback does not mean one trial is sufficient. No measured trial count, success rate or response strength is shown.</desc><rect width="1180" height="430" rx="20" fill="#f3f6f4"/><g font-family="Arial, sans-serif" fill="#183946"><text x="30" y="45" font-size="23" font-weight="bold">Classical conditioning · Event sequence</text><rect x="30" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="48" y="120" font-size="21" font-weight="bold">Before learning</text><text x="48" y="167" font-size="17" font-weight="normal">Tone: neutral stimulus</text><text x="48" y="214" font-size="17" font-weight="normal">No target salivation</text><text x="48" y="261" font-size="17" font-weight="normal">Food: unconditioned stimulus</text><text x="48" y="308" font-size="17" font-weight="normal">Salivation: unconditioned response</text><rect x="415" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="433" y="120" font-size="21" font-weight="bold">Pairing phase</text><text x="433" y="167" font-size="17" font-weight="normal">The tone comes first</text><text x="433" y="214" font-size="17" font-weight="normal">Food follows the tone</text><text x="433" y="261" font-size="17" font-weight="normal">Food elicits salivation</text><text x="433" y="308" font-size="17" font-weight="normal">Repeated pairing supports learning</text><rect x="800" y="80" width="350" height="265" rx="16" fill="white" stroke="#b9d0cb"/><text x="818" y="120" font-size="21" font-weight="bold">After-learning test</text><text x="818" y="167" font-size="17" font-weight="normal">Tone alone: conditioned stimulus</text><text x="818" y="214" font-size="17" font-weight="normal">Food is absent</text><text x="818" y="261" font-size="17" font-weight="normal">Salivation: conditioned response</text><text x="818" y="308" font-size="17" font-weight="normal">Labels depend on learning history</text><text x="30" y="390" font-size="15">Draft demonstration · Teacher review pending</text></g></svg>