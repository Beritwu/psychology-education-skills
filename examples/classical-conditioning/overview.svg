<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc">
<title id="title">Classical conditioning: before, pairing, and after</title>
<desc id="desc">Before learning: food elicits salivation and a tone does not elicit target salivation. During pairing a tone precedes food. After conditioning the tone alone elicits a conditioned response. Schematic draft, not data.</desc>
<rect width="1080" height="370" rx="20" fill="#f3f6f4"/>
<g font-family="Arial, sans-serif" fill="#162e43">
<text x="32" y="45" font-size="15" font-weight="bold">PEBS / LEARNING LAB</text>
<text x="32" y="83" font-size="28" font-weight="bold">One tone. A different meaning after learning.</text>
<g fill="#fff" stroke="#cfdcdd"><rect x="32" y="112" width="326" height="190" rx="12"/><rect x="377" y="112" width="326" height="190" rx="12"/><rect x="722" y="112" width="326" height="190" rx="12"/></g>
<text x="54" y="145" font-size="14" font-weight="bold">01 / BEFORE</text><text x="54" y="186" font-size="18">Food (US) → Salivation (UR)</text><text x="54" y="225" font-size="18">Tone (NS) → No target response</text><text x="54" y="277" font-size="13" fill="#4b6475">Neutral with respect to this response</text>
<text x="399" y="145" font-size="14" font-weight="bold">02 / PAIRING</text><text x="399" y="186" font-size="18" fill="#185ca5">Tone first</text><text x="399" y="225" font-size="18" fill="#8b550d">Then food (US) → Salivation (UR)</text><text x="399" y="277" font-size="13" fill="#4b6475">Repeated pairing; no trial count implied</text>
<text x="744" y="145" font-size="14" font-weight="bold">03 / AFTER CONDITIONING</text><text x="744" y="186" font-size="18" fill="#185ca5">Tone alone (CS)</text><text x="744" y="225" font-size="18" fill="#11694d">→ Salivation (CR)</text><text x="744" y="277" font-size="13" fill="#4b6475">Food is absent in this test</text>
<text x="32" y="339" font-size="13" fill="#4b6475">Draft demonstration · Teacher review pending · Schematic sequence, not experimental data</text>
</g></svg>
