<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 540' role='img' aria-labelledby='t1 a1'><title id='t1'>独立机会、暂停与复位的记录边界</title><desc id='a1'>每次活动固定十个独立机会；提示卡呈现五秒和其他暂停不计为机会；下一机会前恢复为无提示卡。</desc><rect x='0' y='0' width='960' height='540' fill='#F8FAFC'/><text x='480' y='38' text-anchor='middle' font-size='24' font-weight='700' fill='#172033'>独立机会、暂停与复位的记录边界</text><rect x='30' y='58' width='900' height='42' rx='8' fill='#E8EEF7'/><text x='480' y='85' text-anchor='middle' font-size='17' font-weight='600' fill='#253858'>每次活动固定 10 个独立机会｜只记录“目标行为出现／未出现”</text><text x='42' y='132' font-size='16' font-weight='700' fill='#334155'>一个有效机会的顺序</text><rect x='40' y='150' width='150' height='70' rx='10' fill='#FFFFFF' stroke='#64748B' stroke-width='2'/><text x='115' y='179' text-anchor='middle' font-size='15' fill='#172033'>机会开始</text><text x='115' y='202' text-anchor='middle' font-size='14' fill='#334155'>桌面无提示卡</text><line x1='190' y1='185' x2='225' y2='185' stroke='#64748B' stroke-width='2'/><rect x='225' y='150' width='150' height='70' rx='10' fill='#FFFFFF' stroke='#2563EB' stroke-width='2'/><text x='300' y='179' text-anchor='middle' font-size='15' font-weight='700' fill='#1D4ED8'>独立发言机会</text><text x='300' y='202' text-anchor='middle' font-size='14' fill='#334155'>有效记录单位</text><line x1='375' y1='185' x2='410' y2='185' stroke='#64748B' stroke-width='2'/><rect x='410' y='150' width='160' height='70' rx='10' fill='#FFFFFF' stroke='#2563EB' stroke-width='2'/><text x='490' y='179' text-anchor='middle' font-size='15' font-weight='700' fill='#172033'>离散记录结果</text><text x='490' y='202' text-anchor='middle' font-size='14' fill='#334155'>出现 或 未出现</text><line x1='570' y1='185' x2='605' y2='185' stroke='#64748B' stroke-width='2'/><rect x='605' y='150' width='150' height='70' rx='10' fill='#FFF7ED' stroke='#C2410C' stroke-width='2'/><text x='680' y='179' text-anchor='middle' font-size='15' font-weight='700' fill='#9A3412'>目标行为出现后</text><text x='680' y='202' text-anchor='middle' font-size='14' fill='#334155'>加入同一张提示卡</text><line x1='755' y1='185' x2='790' y2='185' stroke='#64748B' stroke-width='2'/><rect x='790' y='150' width='130' height='70' rx='10' fill='#FEF2F2' stroke='#B91C1C' stroke-width='2'/><text x='855' y='179' text-anchor='middle' font-size='15' font-weight='700' fill='#991B1B'>呈现 5 秒</text><text x='855' y='202' text-anchor='middle' font-size='14' fill='#334155'>不计为机会</text><path d='M855 220 L855 254 L680 254' fill='none' stroke='#64748B' stroke-width='2'/><rect x='555' y='236' width='250' height='64' rx='10' fill='#ECFDF5' stroke='#15803D' stroke-width='2'/><text x='680' y='263' text-anchor='middle' font-size='15' font-weight='700' fill='#166534'>撤走提示卡并完成复位</text><text x='680' y='285' text-anchor='middle' font-size='14' fill='#334155'>下一机会前恢复为无提示卡</text><line x1='555' y1='268' x2='405' y2='268' stroke='#64748B' stroke-width='2'/><rect x='225' y='236' width='180' height='64' rx='10' fill='#FFFFFF' stroke='#2563EB' stroke-width='2'/><text x='315' y='263' text-anchor='middle' font-size='15' font-weight='700' fill='#1D4ED8'>下一独立机会</text><text x='315' y='285' text-anchor='middle' font-size='14' fill='#334155'>从统一状态开始</text><rect x='40' y='327' width='880' height='72' rx='10' fill='#FFF1F2' stroke='#BE123C' stroke-width='2'/><text x='65' y='354' font-size='16' font-weight='700' fill='#9F1239'>排除区：提示卡呈现期间及其他暂停时段</text><text x='65' y='382' font-size='15' fill='#4C1D2F'>暂停 ≠ 独立机会；不能加入分母，也不能记作一次“目标行为未出现”。</text><text x='42' y='437' font-size='16' font-weight='700' fill='#334155'>案例中的离散观察记录</text><rect x='40' y='452' width='420' height='58' rx='10' fill='#EFF6FF' stroke='#2563EB' stroke-width='2'/><text x='250' y='477' text-anchor='middle' font-size='16' font-weight='700' fill='#1D4ED8'>前阶段：6 次｜5 次｜6 次</text><text x='250' y='499' text-anchor='middle' font-size='14' fill='#334155'>每次活动均为 10 个独立机会</text><rect x='500' y='452' width='420' height='58' rx='10' fill='#FFF7ED' stroke='#C2410C' stroke-width='2'/><text x='710' y='477' text-anchor='mid