<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 540' role='img' aria-labelledby='t2 a2'><title id='t2'>操作性条件作用的二维四格分类</title><desc id='a2'>依据刺激加入或移除，以及同一目标行为随后增加或减少，完成正强化、负强化、正惩罚和负惩罚的分类。</desc><rect x='0' y='0' width='960' height='540' fill='#F8FAFC'/><text x='480' y='38' text-anchor='middle' font-size='24' font-weight='700' fill='#172033'>操作性条件作用的二维四格分类</text><text x='535' y='72' text-anchor='middle' font-size='15' font-weight='700' fill='#334155'>维度一：目标行为后，刺激发生什么变化？</text><rect x='260' y='88' width='275' height='50' rx='8' fill='#E0F2FE' stroke='#0369A1' stroke-width='2'/><text x='397.5' y='119' text-anchor='middle' font-size='17' font-weight='700' fill='#075985'>刺激加入（正）</text><rect x='535' y='88' width='275' height='50' rx='8' fill='#F3E8FF' stroke='#7E22CE' stroke-width='2'/><text x='672.5' y='119' text-anchor='middle' font-size='17' font-weight='700' fill='#6B21A8'>刺激移除（负）</text><text x='38' y='153' font-size='14' font-weight='700' fill='#334155'>维度二：同一目标行为</text><text x='38' y='174' font-size='14' font-weight='700' fill='#334155'>随后怎样变化？</text><rect x='55' y='190' width='180' height='120' rx='8' fill='#ECFDF5' stroke='#15803D' stroke-width='2'/><text x='145' y='238' text-anchor='middle' font-size='16' font-weight='700' fill='#166534'>随后增加</text><text x='145' y='266' text-anchor='middle' font-size='15' fill='#334155'>强化</text><rect x='55' y='310' width='180' height='120' rx='8' fill='#FFF7ED' stroke='#C2410C' stroke-width='2'/><text x='145' y='358' text-anchor='middle' font-size='16' font-weight='700' fill='#9A3412'>随后减少</text><text x='145' y='386' text-anchor='middle' font-size='15' fill='#334155'>惩罚</text><rect x='260' y='190' width='275' height='120' fill='#F0F9FF' stroke='#64748B' stroke-width='2'/><text x='397.5' y='238' text-anchor='middle' font-size='22' font-weight='700' fill='#075985'>正强化</text><text x='397.5' y='270' text-anchor='middle' font-size='15' fill='#334155'>加入刺激 ＋ 行为随后增加</text><rect x='535' y='190' width='275' height='120' fill='#FAF5FF' stroke='#64748B' stroke-width='2'/><text x='672.5' y='238' text-anchor='middle' font-size='22' font-weight='700' fill='#6B21A8'>负强化</text><text x='672.5' y='270' text-anchor='middle' font-size='15' fill='#334155'>移除刺激 ＋ 行为随后增加</text><rect x='260' y='310' width='275' height='120' fill='#FFF7ED' stroke='#64748B' stroke-width='2'/><text x='397.5' y='358' text-anchor='middle' font-size='22' font-weight='700' fill='#9A3412'>正惩罚</text><text x='397.5' y='390' text-anchor='middle' font-size='15' fill='#334155'>加入刺激 ＋ 行为随后减少</text><rect x='535' y='310' width='275' height='120' fill='#FFF1F2' stroke='#64748B' stroke-width='2'/><text x='672.5' y='358' text-anchor='middle' font-size='22' font-weight='700' fill='#9F1239'>负惩罚</text><text x='672.5' y='390' text-anchor='middle' font-size='15' fill='#334155'>移除刺激 ＋ 行为随后减少</text><rect x='830' y='190' width='105' height='240' rx='8' fill='#FEFCE8' stroke='#A16207' stroke-width='2'/><text x='882.5' y='221' text-anchor='middle' font-size='14' font-weight='700' fill='#854D0E'>必须同时</text><text x='882.5' y='244' text-anchor='middle' font-size='14' font-weight='700' fill='#854D0E'>检查两个维度</text><line x1='848' y1='266' x2='917' y2='266' stroke='#A16207' stroke-width='1.5'/><text x='882.5' y='294' text-anchor='middle' font-size='13' fill='#713F12'>只知加入</text><text x='882.5' y='315' text-anchor='middle' font-size='13' fill='#713F12'>或移除</text><text x='882.5' y='336' text-anchor='middle' font-size='13' fill='#713F12'>不能分类</text><text x='882.5' y='370' text-anchor='middle' font-size='13' fill='#713F12'>缺少行为</text><text x='882.5' y='391' text-anchor='middle' font-size='13' fill='#713F12'>变化记录</text><text x='882.5' y='412' text-anchor='middle' font-size='13' fill='#713F12'>不能分类</text><rect x='55' y='454' width='880' height='62' rx='10' fill='#E8EEF7'/><text x='80' y='480' font-size='15' font-weight='700' fill='#253858'>“正／负”只表示刺激加入或移除，不表示好坏。</text><text x='80' y='503' font-size='15' font-weight='700' fill='#253858'>“强化／惩罚”只表示同一目标行为随后增加或减少，不表示实施者意图。</text></svg>