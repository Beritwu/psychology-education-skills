<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#F7F8FA"/><text x="480" y="39" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">相关陈述 ≠ 因果陈述</text><rect x="180" y="65" width="600" height="66" rx="11" fill="#203A54"/><text x="480" y="91" text-anchor="middle" font-size="16" fill="#D9E7F2">案例研究设计</text><text x="480" y="116" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">虚构观察性调查：不操纵手机使用，不改变课程安排</text><rect x="42" y="165" width="370" height="173" rx="14" fill="#EEF6E9" stroke="#5E8C4A" stroke-width="2"/><text x="227" y="201" text-anchor="middle" font-size="21" font-weight="700" fill="#416B31">材料支持：限定性相关陈述</text><text x="227" y="239" text-anchor="middle" font-size="16" fill="#334155">在本校一个班的志愿学生中</text><text x="227" y="264" text-anchor="middle" font-size="16" fill="#334155">连续五个上课日、按案例具体指标</text><text x="227" y="293" text-anchor="middle" font-size="17" font-weight="700" fill="#416B31">项目摘要称两项记录存在关联</text><rect x="548" y="165" width="370" height="173" rx="14" fill="#FFF2ED" stroke="#B96546" stroke-width="2"/><text x="733" y="201" text-anchor="middle" font-size="21" font-weight="700" fill="#8C432A">材料不支持：确定性因果陈述</text><text x="733" y="247" text-anchor="middle" font-size="18" font-weight="700" fill="#8C432A">“睡前手机使用导致</text><text x="733" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#8C432A">次日专注变化”</text><text x="733" y="312" text-anchor="middle" font-size="15" fill="#5F3A2D">现有材料不足以确认因果效应</text><line x1="480" y1="150" x2="480" y2="349" stroke="#667085" stroke-width="3"/><rect x="426" y="230" width="108" height="51" rx="25" fill="#F7F8FA" stroke="#667085" stroke-width="2"/><text x="480" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#475467">证据</text><text x="480" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#475467">边界</text><rect x="96" y="369" width="768" height="80" rx="12" fill="#FFF7E8" stroke="#C58B2B" stroke-width="2"/><text x="480" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#7A5117">仅凭相关，不能断定因果</text><text x="480" y="429" text-anchor="middle" font-size="15" fill="#6B4B1F">先前知识、题目难度等也可能影响核对题得分</text><rect x="220" y="474" width="520" height="43" rx="9" fill="#E8F3FA" stroke="#3A7CA5" stroke-width="2"/><text x="480" y="502" text-anchor="middle" font-size="17" font-weight="700" fill="#245B7A">证据不足不等于关联不存在</text></svg>