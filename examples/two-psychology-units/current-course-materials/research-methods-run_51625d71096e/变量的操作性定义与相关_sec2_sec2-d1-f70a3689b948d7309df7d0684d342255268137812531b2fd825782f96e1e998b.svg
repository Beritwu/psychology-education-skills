<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f8fafc"/><text x="480" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">相关证据的三栏边界</text><rect x="40" y="72" width="270" height="350" rx="12" fill="#e8f1fb" stroke="#55789b" stroke-width="2"/><rect x="345" y="72" width="270" height="350" rx="12" fill="#fff6df" stroke="#a77c25" stroke-width="2"/><rect x="650" y="72" width="270" height="350" rx="12" fill="#fbecee" stroke="#a95b65" stroke-width="2"/><text x="175" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#274c70">题干已报告</text><line x1="65" y1="126" x2="285" y2="126" stroke="#9bb3c9"/><text x="175" y="180" text-anchor="middle" font-size="18" fill="#172033">学习时间与成绩</text><text x="175" y="210" text-anchor="middle" font-size="18" fill="#172033">存在相关</text><text x="480" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#765718">候选解释</text><line x1="370" y1="126" x2="590" y2="126" stroke="#d4b870"/><rect x="370" y="150" width="220" height="58" rx="8" fill="#ffffff"/><text x="480" y="176" text-anchor="middle" font-size="16" fill="#172033">学习时间可能影响成绩</text><text x="480" y="197" text-anchor="middle" font-size="13" fill="#765718">候选，需证据</text><rect x="370" y="228" width="220" height="58" rx="8" fill="#ffffff"/><text x="480" y="254" text-anchor="middle" font-size="16" fill="#172033">成绩可能影响学习投入</text><text x="480" y="275" text-anchor="middle" font-size="13" fill="#765718">候选，需证据</text><rect x="370" y="306" width="220" height="72" rx="8" fill="#ffffff"/><text x="480" y="332" text-anchor="middle" font-size="16" fill="#172033">共同原因可能同时影响</text><text x="480" y="354" text-anchor="middle" font-size="16" fill="#172033">学习时间与成绩</text><text x="480" y="372" text-anchor="middle" font-size="13" fill="#765718">候选，需证据</text><text x="785" y="110" text-anchor="middle" font-size="20" font-weight="700" fill="#843d48">尚不能确认</text><line x1="675" y1="126" x2="895" y2="126" stroke="#d9a1a9"/><text x="785" y="180" text-anchor="middle" font-size="17" fill="#172033">因果关系</text><text x="785" y="230" text-anchor="middle" font-size="17" fill="#172033">具体效应</text><text x="785" y="280" text-anchor="middle" font-size="17" fill="#172033">共同原因或中介角色</text><text x="785" y="338" text-anchor="middle" font-size="14" fill="#843d48">仍需时序、操纵、分配</text><text x="785" y="362" text-anchor="middle" font-size="14" fill="#843d48">或测量信息支持</text><rect x="90" y="455" width="780" height="55" rx="12" fill="#27364a"/><text x="480" y="489" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">仅凭相关，不能断定因果</text></svg>