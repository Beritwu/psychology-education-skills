<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#F7F8FA"/><text x="480" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">虚构案例：操作性定义四栏核查</text><rect x="30" y="66" width="900" height="365" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><rect x="30" y="66" width="900" height="58" rx="12" fill="#203A54"/><line x1="235" y1="66" x2="235" y2="431" stroke="#94A3B8" stroke-width="2"/><line x1="465" y1="66" x2="465" y2="431" stroke="#94A3B8" stroke-width="2"/><line x1="715" y1="66" x2="715" y2="431" stroke="#94A3B8" stroke-width="2"/><line x1="30" y1="124" x2="930" y2="124" stroke="#94A3B8" stroke-width="2"/><line x1="30" y1="277" x2="930" y2="277" stroke="#94A3B8" stroke-width="2"/><text x="132" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">变量或研究构念</text><text x="350" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">可观察指标</text><text x="590" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">记录或计分规则</text><text x="822" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">时间范围与</text><text x="822" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">缺失处理</text><rect x="43" y="139" width="179" height="121" rx="8" fill="#E8F3FA"/><text x="132" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#245B7A">睡前手机使用</text><text x="132" y="204" text-anchor="middle" font-size="14" fill="#475467">不再以“手机依赖</text><text x="132" y="225" text-anchor="middle" font-size="14" fill="#475467">程度”命名</text><text x="350" y="166" text-anchor="middle" font-size="15" fill="#273142">以自报入睡时间为终点</text><text x="350" y="190" text-anchor="middle" font-size="15" fill="#273142">前一小时内</text><text x="350" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#245B7A">屏幕使用分钟数</text><text x="590" y="164" text-anchor="middle" font-size="14" fill="#273142">每天早晨查询手机系统记录</text><text x="590" y="188" text-anchor="middle" font-size="14" fill="#273142">结合自报入睡时间填写</text><text x="590" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#8A531F">无法查询或未报告：</text><text x="590" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#8A531F">记为缺失，不自行补数</text><text x="822" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#273142">连续五个上课日</text><text x="822" y="215" text-anchor="middle" font-size="14" fill="#76512E">缺失按左侧规则标记</text><rect x="43" y="292" width="179" height="121" rx="8" fill="#EEF6E9"/><text x="132" y="329" text-anchor="middle" font-size="17" font-weight="700" fill="#416B31">课堂专注</text><text x="132" y="359" text-anchor="middle" font-size="14" fill="#475467">目标研究构念</text><text x="132" y="384" text-anchor="middle" font-size="14" fill="#475467">指标仅为间接反映</text><text x="350" y="322" text-anchor="middle" font-size="14" fill="#273142">当天第一节课结束后</text><text x="350" y="347" text-anchor="middle" font-size="14" fill="#273142">十道指定内容核对题</text><text x="350" y="375" text-anchor="middle" font-size="16" font-weight="700" fill="#416B31">答对题数</text><text x="590" y="318" text-anchor="middle" font-size="14" fill="#273142">答对一分</text><text x="590" y="342" text-anchor="middle" font-size="14" fill="#273142">答错或未作答零分</text><text x="590" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#416B31">总分零至十分</text><text x="822" y="319" text-anchor="middle" font-size="14" fill="#273142">第一节课结束后</text><text x="822" y="345" text-anchor="middle" font-size="14" fill="#273142">限时十分钟</text><text x="822" y="373" text-anchor="middle" font-size="15" font-weight="700" fill="#273142">连续五个上课日</text><rect x="55" y="452" width="850" height="58" rx="10" fill="#FFF7E8" stroke="#C58B2B" stroke-width="2"/><text x="480" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#7A5117">构念—指标边界</text><text x="480" y="499" text-anchor="middle" font-size="16" fill="#7A5117">屏幕使用分钟数 ≠ 手机依赖程度；核对题得分 ≠ 课堂专注本身</text></svg>