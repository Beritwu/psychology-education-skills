<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#F7F8FA"/><text x="480" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#172033">本课操作性定义检查模板</text><rect x="55" y="105" width="205" height="115" rx="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/><text x="157" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#273142">抽象变量名称</text><text x="157" y="184" text-anchor="middle" font-size="17" fill="#596273">尚不能直接记录</text><line x1="260" y1="162" x2="330" y2="162" stroke="#667085" stroke-width="3"/><rect x="270" y="130" width="50" height="25" rx="5" fill="#F7F8FA"/><text x="295" y="148" text-anchor="middle" font-size="15" fill="#475467">具体化</text><rect x="330" y="82" width="575" height="215" rx="16" fill="#FFFFFF" stroke="#315B7D" stroke-width="2"/><text x="617" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#193B57">操作性定义</text><text x="617" y="144" text-anchor="middle" font-size="16" fill="#526273">具体、可检验，原则上可重复执行</text><rect x="365" y="170" width="150" height="88" rx="10" fill="#E8F3FA" stroke="#3A7CA5" stroke-width="2"/><text x="440" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#245B7A">可观察指标</text><text x="440" y="232" text-anchor="middle" font-size="15" fill="#31566B">实际记录什么</text><rect x="542" y="170" width="175" height="88" rx="10" fill="#EEF6E9" stroke="#5E8C4A" stroke-width="2"/><text x="629" y="202" text-anchor="middle" font-size="17" font-weight="700" fill="#416B31">记录方式或</text><text x="629" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#416B31">计分规则</text><rect x="744" y="170" width="126" height="88" rx="10" fill="#FFF3E6" stroke="#C47A32" stroke-width="2"/><text x="807" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#8A531F">时间范围</text><text x="807" y="232" text-anchor="middle" font-size="15" fill="#76512E">何时、多久</text><rect x="115" y="334" width="730" height="76" rx="12" fill="#172F46"/><text x="480" y="365" text-anchor="middle" font-size="17" fill="#D9E7F2">核查句</text><text x="480" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">谁在何时，用什么工具，按什么规则，得到什么数值？</text><rect x="115" y="438" width="730" height="60" rx="10" fill="#FFF7E8" stroke="#C58B2B" stroke-width="2"/><text x="480" y="475" text-anchor="middle" font-size="18" font-weight="700" fill="#7A5117">证据边界：具体指标是构念的一种操作化方式，不等同于构念本身</text></svg>