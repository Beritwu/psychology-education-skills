<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f8fafc"/><text x="480" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">随机分配程序审查流程</text><rect x="35" y="95" width="145" height="64" rx="10" fill="#e9f2fa" stroke="#6686a2" stroke-width="2"/><text x="107" y="122" text-anchor="middle" font-size="15" fill="#172033">已纳入的</text><text x="107" y="144" text-anchor="middle" font-size="15" fill="#172033">参与者</text><path d="M180 127 L220 127" stroke="#526b80" stroke-width="2" fill="none"/><path d="M220 127 L211 122 L211 132 Z" fill="#526b80"/><rect x="220" y="88" width="190" height="78" rx="10" fill="#ffffff" stroke="#6686a2" stroke-width="2"/><text x="315" y="116" text-anchor="middle" font-size="14" fill="#172033">是否使用预先确定的</text><text x="315" y="139" text-anchor="middle" font-size="14" fill="#172033">随机机制？</text><path d="M410 127 L450 127" stroke="#526b80" stroke-width="2" fill="none"/><path d="M450 127 L441 122 L441 132 Z" fill="#526b80"/><rect x="450" y="88" width="190" height="78" rx="10" fill="#ffffff" stroke="#6686a2" stroke-width="2"/><text x="545" y="113" text-anchor="middle" font-size="14" fill="#172033">被分配对象是否为</text><text x="545" y="136" text-anchor="middle" font-size="14" fill="#172033">已纳入参与者？</text><path d="M640 127 L680 127" stroke="#526b80" stroke-width="2" fill="none"/><path d="M680 127 L671 122 L671 132 Z" fill="#526b80"/><rect x="680" y="88" width="240" height="78" rx="10" fill="#ffffff" stroke="#6686a2" stroke-width="2"/><text x="800" y="113" text-anchor="middle" font-size="14" fill="#172033">参与者是否被分入</text><text x="800" y="136" text-anchor="middle" font-size="14" fill="#172033">研究条件？</text><path d="M800 166 L800 208" stroke="#526b80" stroke-width="2" fill="none"/><path d="M800 208 L795 199 L805 199 Z" fill="#526b80"/><rect x="670" y="208" width="260" height="58" rx="10" fill="#e4f1e3" stroke="#64845e" stroke-width="2"/><text x="800" y="243" text-anchor="middle" font-size="17" font-weight="700" fill="#3f6339">程序证据支持随机分配</text><path d="M315 166 L315 208" stroke="#9b626a" stroke-width="2" fill="none"/><path d="M315 208 L310 199 L320 199 Z" fill="#9b626a"/><rect x="45" y="208" width="540" height="82" rx="10" fill="#fff0f1" stroke="#aa6871" stroke-width="2"/><text x="315" y="236" text-anchor="middle" font-size="15" fill="#733942">方便分组、按顺序交替分组、参与者自选条件</text><text x="315" y="261" text-anchor="middle" font-size="15" fill="#733942">或仅仅人数相同，均不足以证明随机分配</text><text x="315" y="281" text-anchor="middle" font-size="12" fill="#733942">应返回题干检查实际机制</text><text x="480" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">即使实施了随机分配，仍有以下结论边界</text><rect x="45" y="365" width="265" height="105" rx="10" fill="#fff7df" stroke="#b18b32"/><text x="177" y="407" text-anchor="middle" font-size="16" fill="#6f541d">不等于从目标人群</text><text x="177" y="433" text-anchor="middle" font-size="16" fill="#6f541d">随机抽样</text><rect x="347" y="365" width="265" height="105" rx="10" fill="#fff7df" stroke="#b18b32"/><text x="479" y="400" text-anchor="middle" font-size="15" fill="#6f541d">不保证有限样本中</text><text x="479" y="425" text-anchor="middle" font-size="15" fill="#6f541d">各组所有特征</text><text x="479" y="450" text-anchor="middle" font-size="15" fill="#6f541d">完全相同</text><rect x="650" y="365" width="265" height="105" rx="10" fill="#fff7df" stroke="#b18b32"/><text x="782" y="407" text-anchor="middle" font-size="16" fill="#6f541d">随机分配本身</text><text x="782" y="433" text-anchor="middle" font-size="16" fill="#6f541d">不证明干预有效</text></svg>