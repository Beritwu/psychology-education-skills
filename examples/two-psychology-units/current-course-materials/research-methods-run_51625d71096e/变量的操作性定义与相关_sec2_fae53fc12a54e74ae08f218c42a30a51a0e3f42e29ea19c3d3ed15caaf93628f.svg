<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f8fafc"/><text x="480" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#172033">校园睡眠研究中的两次随机程序</text><rect x="25" y="80" width="420" height="340" rx="14" fill="#edf5fc" stroke="#6487a6" stroke-width="2"/><text x="235" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#315878">第一问：谁如何进入样本？</text><rect x="50" y="135" width="155" height="54" rx="8" fill="#ffffff" stroke="#7594ad"/><text x="127" y="168" text-anchor="middle" font-size="16" fill="#172033">某校本科生名册</text><path d="M205 162 L240 162" stroke="#526b80" stroke-width="2" fill="none"/><path d="M240 162 L232 157 L232 167 Z" fill="#526b80"/><rect x="240" y="125" width="180" height="74" rx="8" fill="#ffffff" stroke="#7594ad"/><text x="330" y="151" text-anchor="middle" font-size="14" fill="#172033">预先设定的计算机</text><text x="330" y="173" text-anchor="middle" font-size="14" fill="#172033">随机编号程序</text><text x="330" y="191" text-anchor="middle" font-size="12" fill="#315878">抽取200名并邀请</text><path d="M330 199 L330 235" stroke="#526b80" stroke-width="2" fill="none"/><path d="M330 235 L325 227 L335 227 Z" fill="#526b80"/><rect x="220" y="235" width="200" height="58" rx="8" fill="#ffffff" stroke="#7594ad"/><text x="320" y="260" text-anchor="middle" font-size="15" fill="#172033">120人同意参加</text><text x="320" y="281" text-anchor="middle" font-size="13" fill="#315878">进入研究</text><path d="M240 264 L180 264 L180 315" stroke="#8a6870" stroke-width="2" fill="none"/><path d="M180 315 L175 307 L185 307 Z" fill="#8a6870"/><rect x="50" y="315" width="260" height="63" rx="8" fill="#fff1f2" stroke="#ae727a"/><text x="180" y="340" text-anchor="middle" font-size="14" fill="#6f3540">80名受邀者未进入研究</text><text x="180" y="361" text-anchor="middle" font-size="13" fill="#6f3540">拒绝邀请的原因未报告</text><rect x="50" y="390" width="370" height="45" rx="8" fill="#fff8df" stroke="#b28b32"/><text x="235" y="418" text-anchor="middle" font-size="14" fill="#765718">随机抽样具体术语及精确推断边界：待核验</text><rect x="480" y="80" width="455" height="340" rx="14" fill="#f1f5ed" stroke="#748b62" stroke-width="2"/><text x="707" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#49633a">第二问：已纳入者如何进入研究条件？</text><rect x="585" y="135" width="245" height="70" rx="8" fill="#ffffff" stroke="#7f9670"/><text x="707" y="161" text-anchor="middle" font-size="14" fill="#172033">对120名参与者使用另一套</text><text x="707" y="183" text-anchor="middle" font-size="14" fill="#172033">预先确定的计算机随机程序</text><path d="M707 205 L707 240 L590 240 L590 275" stroke="#596d4b" stroke-width="2" fill="none"/><path d="M590 275 L585 267 L595 267 Z" fill="#596d4b"/><path d="M707 240 L825 240 L825 275" stroke="#596d4b" stroke-width="2" fill="none"/><path d="M825 275 L820 267 L830 267 Z" fill="#596d4b"/><rect x="500" y="275" width="180" height="68" rx="9" fill="#ffffff" stroke="#7f9670"/><text x="590" y="303" text-anchor="middle" font-size="16" fill="#172033">晚间提醒条件</text><text x="590" y="327" text-anchor="middle" font-size="15" fill="#49633a">60人</text><rect x="735" y="275" width="180" height="68" rx="9" fill="#ffffff" stroke="#7f9670"/><text x="825" y="303" text-anchor="middle" font-size="16" fill="#172033">无提醒条件</text><text x="825" y="327" text-anchor="middle" font-size="15" fill="#49633a">60人</text><rect x="525" y="365" width="365" height="48" rx="8" fill="#e7efdf"/><text x="707" y="386" text-anchor="middle" font-size="13" fill="#3f5732">随机分配定位：已纳入参与者</text><text x="707" y="404" text-anchor="middle" font-size="13" fill="#3f5732">如何进入研究条件</text><rect x="55" y="458" width="850" height="55" rx="10" fill="#27364a"/><text x="480" y="481" text-anchor="middle" font-size="15" fill="#ffffff">两次程序作用对象不同：名册中的人员 → 受邀与参加；已参加的120人 → 研究条件</text><text x="480" y="502" text-anchor="middle" font-size="14" fill="#dbe7f3">两组其他特征、个体睡眠数据及组间统计结果均未报告</text></svg>