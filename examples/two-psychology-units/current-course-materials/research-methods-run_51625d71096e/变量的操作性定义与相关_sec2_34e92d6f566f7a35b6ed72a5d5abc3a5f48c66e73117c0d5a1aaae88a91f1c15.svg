<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f8fafc"/><text x="480" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#172033">观察研究的谨慎判断表</text><text x="480" y="62" text-anchor="middle" font-size="13" fill="#566579">虚构示例：暴露 X、结果 Y 与候选解释</text><rect x="20" y="85" width="176" height="365" fill="#eaf2f9" stroke="#748ba1"/><rect x="206" y="85" width="176" height="365" fill="#fff5dd" stroke="#a9863b"/><rect x="392" y="85" width="176" height="365" fill="#eef3e8" stroke="#7a9068"/><rect x="578" y="85" width="176" height="365" fill="#fbecee" stroke="#aa6b73"/><rect x="764" y="85" width="176" height="365" fill="#f0ecf7" stroke="#81739a"/><rect x="20" y="85" width="176" height="48" fill="#d7e6f3"/><rect x="206" y="85" width="176" height="48" fill="#f4e4b9"/><rect x="392" y="85" width="176" height="48" fill="#dce8d2"/><rect x="578" y="85" width="176" height="48" fill="#f2d9dd"/><rect x="764" y="85" width="176" height="48" fill="#e1daed"/><text x="108" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#294b67">题干已报告</text><text x="294" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#70551d">候选路径</text><text x="480" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#48603b">时序与</text><text x="480" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#48603b">路径依据</text><text x="666" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#783f48">不能确认的</text><text x="666" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#783f48">结论</text><text x="852" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#594878">仍需证据</text><text x="108" y="165" text-anchor="middle" font-size="13" fill="#172033">暴露 X 与</text><text x="108" y="187" text-anchor="middle" font-size="13" fill="#172033">结果 Y</text><text x="108" y="209" text-anchor="middle" font-size="13" fill="#172033">存在相关</text><line x1="40" y1="230" x2="176" y2="230" stroke="#9eb3c5"/><text x="108" y="258" text-anchor="middle" font-size="12" fill="#294b67">已记录：</text><text x="108" y="280" text-anchor="middle" font-size="12" fill="#172033">暴露前候选变量 C</text><text x="108" y="302" text-anchor="middle" font-size="12" fill="#172033">暴露后的候选变量</text><text x="108" y="324" text-anchor="middle" font-size="12" fill="#172033">中介 M</text><text x="108" y="370" text-anchor="middle" font-size="12" fill="#783f48">没有随机分配</text><text x="108" y="394" text-anchor="middle" font-size="11" fill="#783f48">其他变量关系未报告</text><text x="294" y="165" text-anchor="middle" font-size="13" fill="#172033">候选共同原因</text><text x="294" y="190" text-anchor="middle" font-size="11" fill="#70551d">候选变量 C</text><text x="294" y="210" text-anchor="middle" font-size="11" fill="#70551d">↘ 暴露 X</text><text x="294" y="230" text-anchor="middle" font-size="11" fill="#70551d">↘ 结果 Y</text><line x1="226" y1="250" x2="362" y2="250" stroke="#d2b66f"/><text x="294" y="278" text-anchor="middle" font-size="13" fill="#172033">候选中介路径</text><text x="294" y="303" text-anchor="middle" font-size="11" fill="#70551d">暴露 X</text><text x="294" y="323" text-anchor="middle" font-size="11" fill="#70551d">→ 中介 M</text><text x="294" y="343" text-anchor="middle" font-size="11" fill="#70551d">→ 结果 Y</text><text x="294" y="397" text-anchor="middle" font-size="12" fill="#70551d">均为候选，需证据</text><text x="480" y="170" text-anchor="middle" font-size="12" fill="#172033">候选变量 C</text><text x="480" y="192" text-anchor="middle" font-size="12" fill="#172033">在暴露前记录</text><text x="480" y="232" text-anchor="middle" font-size="12" fill="#48603b">时间位置与候选</text><text x="480" y="252" text-anchor="middle" font-size="12" fill="#48603b">共同原因结构一致</text><line x1="412" y1="272" x2="548" y2="272" stroke="#aabd9a"/><text x="480" y="302" text-anchor="middle" font-size="12" fill="#172033">变量 M 在暴露后</text><text x="480" y="324" text-anchor="middle" font-size="12" fill="#172033">结果前记录</text><text x="480" y="364" text-anchor="middle" font-size="12" fill="#48603b">时间位置与候选</text><text x="480" y="384" text-anchor="middle" font-size="12" fill="#48603b">中介路径一致</text><text x="480" y="420" text-anchor="middle" font-size="11" fill="#783f48">时间位置并非角色证明</text><text x="666" y="170" text-anchor="middle" font-size="12" fill="#172033">不能确认</text><text x="666" y="194" text-anchor="middle" font-size="12" fill="#172033">变量角色</text><text x="666" y="218" text-anchor="middle" font-size="12" fill="#172033">箭头方向</text><line x1="598" y1="242" x2="734" y2="242" stroke="#d6a1a8"/><text x="666" y="278" text-anchor="middle" font-size="12" fill="#172033">不能确认暴露 X</text><text x="666" y="300" text-anchor="middle" font-size="12" fill="#172033">造成结果 Y 的变化</text><text x="666" y="355" text-anchor="middle" font-size="12" fill="#783f48">不能把“可能”</text><text x="666" y="377" text-anchor="middle" font-size="12" fill="#783f48">改写成“已证实”</text><text x="852" y="160" text-anchor="middle" font-size="12" fill="#172033">暴露前基线测量</text><text x="852" y="190" text-anchor="middle" font-size="12" fill="#172033">可靠的发生顺序记录</text><text x="852" y="220" text-anchor="middle" font-size="12" fill="#172033">候选变量与暴露、</text><text x="852" y="240" text-anchor="middle" font-size="12" fill="#172033">结果之间的测量关系</text><text x="852" y="280" text-anchor="middle" font-size="12" fill="#172033">操纵与分配程序</text><text x="852" y="320" text-anchor="middle" font-size="12" fill="#172033">比较不同候选解释的</text><text x="852" y="340" text-anchor="middle" font-size="12" fill="#172033">设计和分析</text><text x="852" y="395" text-anchor="middle" font-size="11" fill="#594878">所需证据依具体判断而定</text><rect x="120" y="475" width="720" height="42" rx="10" fill="#27364a"/><text x="480" y="502" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">谨慎结论：现有证据不能确认路径；证据不足也不等于没有作用</text></svg>