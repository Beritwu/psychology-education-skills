<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#F7F8FA"/><text x="480" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">研究结论的证据边界审查</text><rect x="210" y="72" width="540" height="350" rx="18" fill="#FFFFFF" stroke="#315B7D" stroke-width="4"/><rect x="365" y="57" width="230" height="38" rx="19" fill="#315B7D"/><text x="480" y="82" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">边界内：材料已报告</text><rect x="247" y="115" width="466" height="47" rx="9" fill="#E8F3FA"/><text x="480" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#245B7A">虚构观察性调查；不操纵手机使用，不改变课程安排</text><rect x="247" y="177" width="218" height="65" rx="9" fill="#EEF6E9"/><text x="356" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#416B31">样本来源</text><text x="356" y="227" text-anchor="middle" font-size="14" fill="#334155">本校一个班的志愿学生</text><rect x="495" y="177" width="218" height="65" rx="9" fill="#EEF6E9"/><text x="604" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#416B31">记录时段</text><text x="604" y="227" text-anchor="middle" font-size="14" fill="#334155">连续五个上课日</text><rect x="247" y="257" width="466" height="68" rx="9" fill="#F1F5F9"/><text x="480" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">具体测量</text><text x="480" y="307" text-anchor="middle" font-size="14" fill="#334155">睡前一小时屏幕使用分钟数与当天核对题得分</text><rect x="247" y="340" width="466" height="56" rx="9" fill="#203A54"/><text x="480" y="375" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">摘要报告：两项记录在该样本中存在关联</text><rect x="22" y="102" width="163" height="55" rx="9" fill="#FFF7E8" stroke="#C58B2B" stroke-width="2"/><text x="103" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#7A5117">关联方向待核验</text><rect x="22" y="181" width="163" height="55" rx="9" fill="#FFF7E8" stroke="#C58B2B" stroke-width="2"/><text x="103" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#7A5117">关联强度待核验</text><rect x="22" y="260" width="163" height="55" rx="9" fill="#FFF7E8" stroke="#C58B2B" stroke-width="2"/><text x="103" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#7A5117">统计显著性待核验</text><rect x="775" y="141" width="163" height="55" rx="9" fill="#FFF7E8" stroke="#C58B2B" stroke-width="2"/><text x="856" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#7A5117">样本代表性待核验</text><rect x="775" y="237" width="163" height="55" rx="9" fill="#FFF7E8" stroke="#C58B2B" stroke-width="2"/><text x="856" y="271" text-anchor="middle" font-size="16" font-weight="700" fill="#7A5117">因果效应待核验</text><text x="103" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#7A5117">边界外：待核验</text><text x="856" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#7A5117">边界外：待核验</text><rect x="125" y="451" width="710" height="64" rx="11" fill="#172F46"/><text x="480" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">审查规则：未报告的信息不自行补充</text><text x="480" y="500" text-anchor="middle" font-size="15" fill="#D9E7F2">结论受样本、时段、具体测量和研究设计限制</text></svg>