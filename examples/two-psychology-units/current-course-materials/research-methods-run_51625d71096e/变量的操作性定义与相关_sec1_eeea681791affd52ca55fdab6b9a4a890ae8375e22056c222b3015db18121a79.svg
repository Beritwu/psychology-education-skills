<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" fill="#F7F8FA"/><text x="480" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">相关方向：只依据材料实际表述</text><rect x="35" y="78" width="278" height="190" rx="13" fill="#EEF6E9" stroke="#5E8C4A" stroke-width="2"/><text x="174" y="113" text-anchor="middle" font-size="20" font-weight="700" fill="#416B31">正向相关表述</text><circle cx="104" cy="207" r="10" fill="#5E8C4A"/><circle cx="147" cy="184" r="10" fill="#5E8C4A"/><circle cx="190" cy="157" r="10" fill="#5E8C4A"/><circle cx="233" cy="133" r="10" fill="#5E8C4A"/><text x="174" y="244" text-anchor="middle" font-size="15" fill="#334155">一个变量较高时</text><text x="174" y="264" text-anchor="middle" font-size="15" fill="#334155">另一个也倾向较高</text><rect x="341" y="78" width="278" height="190" rx="13" fill="#FFF2ED" stroke="#B96546" stroke-width="2"/><text x="480" y="113" text-anchor="middle" font-size="20" font-weight="700" fill="#8C432A">负向相关表述</text><circle cx="410" cy="133" r="10" fill="#B96546"/><circle cx="453" cy="157" r="10" fill="#B96546"/><circle cx="496" cy="184" r="10" fill="#B96546"/><circle cx="539" cy="207" r="10" fill="#B96546"/><text x="480" y="244" text-anchor="middle" font-size="15" fill="#334155">一个变量较高时</text><text x="480" y="264" text-anchor="middle" font-size="15" fill="#334155">另一个倾向较低</text><rect x="647" y="78" width="278" height="190" rx="13" fill="#FFF7E8" stroke="#C58B2B" stroke-width="3"/><text x="786" y="113" text-anchor="middle" font-size="20" font-weight="700" fill="#7A5117">未说明方向</text><text x="786" y="154" text-anchor="middle" font-size="17" fill="#334155">材料只报告</text><text x="786" y="181" text-anchor="middle" font-size="19" font-weight="700" fill="#7A5117">“存在关联”</text><text x="786" y="217" text-anchor="middle" font-size="15" fill="#334155">不能自行改写为</text><text x="786" y="240" text-anchor="middle" font-size="15" fill="#334155">正向或负向</text><rect x="74" y="302" width="812" height="74" rx="12" fill="#203A54"/><text x="480" y="331" text-anchor="middle" font-size="16" fill="#D9E7F2">案例已报告</text><text x="480" y="358" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">两项具体记录在该样本中存在关联</text><line x1="786" y1="268" x2="786" y2="302" stroke="#667085" stroke-width="3"/><rect x="135" y="405" width="205" height="54" rx="9" fill="#FFFFFF" stroke="#C58B2B" stroke-width="2"/><text x="237" y="438" text-anchor="middle" font-size="17" font-weight="700" fill="#7A5117">方向待核验</text><rect x="378" y="405" width="205" height="54" rx="9" fill="#FFFFFF" stroke="#C58B2B" stroke-width="2"/><text x="480" y="438" text-anchor="middle" font-size="17" font-weight="700" fill="#7A5117">强度待核验</text><rect x="621" y="405" width="205" height="54" rx="9" fill="#FFFFFF" stroke="#C58B2B" stroke-width="2"/><text x="723" y="438" text-anchor="middle" font-size="17" font-weight="700" fill="#7A5117">统计显著性待核验</text><rect x="135" y="480" width="691" height="38" rx="8" fill="#FFF7E8"/><text x="480" y="505" text-anchor="middle" font-size="17" font-weight="700" fill="#7A5117">核查规则：未提供方向或统计结果时，不自行补充</text></svg>